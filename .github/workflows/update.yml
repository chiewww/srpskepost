name: Update Pošta Srpske country list
on:
workflow_dispatch:
schedule:
- cron: "17 6 * * *"
permissions:
contents: write
jobs:
update:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4
- name: Python
uses: actions/setup-python@v5
with:
python-version: "3.x"
- name: Install dependencies
run: pip install -r requirements.txt
- name: Run scraper
run: python update.py
- name: Commit output
run: |
git config user.name "github-actions[bot]"
git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
git add output.txt
if git diff --cached --quiet; then
echo "No changes to output.txt"
else
git commit -m "Update Pošta Srpske country list"
git push
fi
