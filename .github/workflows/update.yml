name: Update Pošta Srpske country list

on:
  workflow_dispatch:

  schedule:
    # Every day at 06:17 Europe/Belgrade time.
    #
    # 06:17 is deliberately not on the hour to reduce the chance
    # of GitHub Actions schedule delays during high-load periods.
    - cron: "17 6 * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and parse Pošta Srpske
        run: |
          python update.py

      - name: Check whether output changed
        id: changes
        run: |
          if git diff --quiet -- output.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changed output
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output.txt

          git commit -m "Update Pošta Srpske country list"

          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No changes detected. output.txt is unchanged."
