```yaml
name: Update Pošta Srpske country list

on:
  workflow_dispatch:

  schedule:
    # Every day at 06:17 Europe/Belgrade time.
    - cron: "17 6 * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and parse Pošta Srpske
        run: |
          python update.py

      - name: Check output file
        run: |
          echo "Contents of output.txt:"
          echo "----------------------------------------"
          head -50 output.txt
          echo "----------------------------------------"

          echo "File information:"
          wc -l output.txt
          wc -c output.txt

      - name: Check whether output changed
        id: changes
        run: |
          if git status --short -- output.txt | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "output.txt is new or changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "output.txt has not changed."
          fi

      - name: Commit changed output
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output.txt

          git commit -m "Update Pošta Srpske country list"

          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No changes detected. output.txt is unchanged."
```
